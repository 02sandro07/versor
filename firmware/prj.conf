#
# CDC-INCO-Bringup-R1A — Inbetriebnahme-/Testfirmware fuer die R1A
# (CU-Platine + Power-Platine). Liefert alle Felder aus Testplan Kap. 3,
# Modi normal/live/drain, nPM1300 (Laden, Akku, LEDs).
# Konsole + Shell laufen ueber SEGGER RTT (die CU-Platine hat kein USB/UART-RX;
# RTT geht ueber die gleichen SWD-Leitungen wie das Flashen).
#

# --- Konsole & Shell nur ueber RTT ---
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_UART_CONSOLE=n
CONFIG_SERIAL=n
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=n
CONFIG_SHELL_BACKEND_RTT=y

# --- Logging: dedizierter RTT-Log-Backend (NICHT ueber die Shell) ---
CONFIG_LOG=y
# Immediate (synchronous) logging: writes each line to RTT in the caller's
# context. Dedicated RTT backend (LOG_BACKEND_RTT) writes straight to RTT
# up-channel 0 — independent of the shell. Routing logs through the shell
# (SHELL_LOG_BACKEND) does NOT emit until a terminal is "connected", so the
# RTT up-buffer stayed empty (WrOff=0) when read headless over SWD; disable it.
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_RTT_MODE_DROP=y
# Shell keeps RTT up-channel 0; put the dedicated log backend on up-channel 1
# to avoid the "conflicting log RTT backend on the same channel" build error.
CONFIG_LOG_BACKEND_RTT_BUFFER=1
CONFIG_LOG_BACKEND_RTT_BUFFER_SIZE=4096
CONFIG_SHELL_LOG_BACKEND=n
# Keep the whole diagnostic history in the RTT up-buffer so a late reader still
# sees the SIM/registration/signal lines, not just the latest heartbeat.
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=8192

# --- Peripherie ---
CONFIG_I2C=y
CONFIG_ADC=y
CONFIG_GPIO=y

# --- nPM1300 PMIC (Power board): MFD + regulators + charger sensor + LEDs ---
# The drivers are pulled in by the npm1300 node in the board overlay. Without
# the Power board they fail their init quietly and pmic.c reports "absent".
CONFIG_SENSOR=y
CONFIG_REGULATOR=y
CONFIG_LED=y
# nRF Fuel Gauge: enable once a profiled model of the PL405070 exists as
# src/battery_model.inc (nPM PowerUP). Until then pmic.c estimates soc from OCV.
# CONFIG_NRF_FUEL_GAUGE=y
# CONFIG_NRF_FUEL_GAUGE_VARIANT_SECONDARY_CELL=y

# --- Watchdog + reset cause (rst field, Testplan A-3) ---
CONFIG_WATCHDOG=y
CONFIG_HWINFO=y

# --- Modem / LTE ---
CONFIG_NRF_MODEM_LIB=y
CONFIG_LTE_LINK_CONTROL=y
# PDN submodule is required for the default-APN override below to take effect.
CONFIG_LTE_LC_PDN_MODULE=y
CONFIG_LTE_LC_PDN_DEFAULTS_OVERRIDE=y
CONFIG_LTE_LC_PDN_DEFAULT_APN="wsim"
# LTE-M + GPS: ein RF-Frontend wird zwischen LTE und GNSS geteilt.
CONFIG_LTE_NETWORK_MODE_LTE_M_GPS=y
CONFIG_MODEM_INFO=y
CONFIG_MODEM_INFO_ADD_NETWORK=y
# PSM for the "normal" mode. Only REQUESTED at runtime (main.c apply_mode) and
# only together with connect -> send -> disconnect cycles: PSM on top of an
# always-on MQTT session breaks it (see deep-sleep-vs-mqtt). live/drain turn it off.
CONFIG_LTE_LC_PSM_MODULE=y
# Bound a blocking attach attempt (default 600 s). Without coverage the modem
# keeps searching in the background and main.c retries without blocking.
CONFIG_LTE_NETWORK_TIMEOUT=180
# Capture modem faults in an application-specific handler (modemdiag.c) so the
# diagnostic can record the fault reason + PC, instead of silently auto-resetting.
CONFIG_NRF_MODEM_LIB_ON_FAULT_APPLICATION_SPECIFIC=y

# --- Sockets (offloaded aufs Modem) fuer den Erreichbarkeitstest ---
CONFIG_NETWORKING=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_POSIX_API=y

# --- TLS/MQTT publish ('bu pub') zum HiveMQ-Broker ---
# TLS wird aufs Modem ausgelagert (kein mbedTLS im App-Image noetig). Die CA
# liegt auf BROKER_SEC_TAG (16842), provisioniert von credentials.c beim Boot.
CONFIG_MQTT_LIB=y
CONFIG_MQTT_LIB_TLS=y
CONFIG_MODEM_KEY_MGMT=y

# --- Netzwerkzeit (fuer JWT-Signatur + "ts" im JSON) ---
# date_time holt die Zeit automatisch vom Modem, sobald LTE attached ist. Ohne
# gueltige Zeit scheitert die JWT-Erzeugung fuer den A-GNSS-REST-Call (-62), und
# eine gueltige Zeit hilft GNSS enorm beim ersten Fix (kein Uhr-Cold-Start).
CONFIG_DATE_TIME=y

# --- A-GNSS Assistenz via nRF Cloud REST (Ephemeriden-Download = schneller Fix)
# Statt die Satelliten-Bahndaten mit 50 bit/s vom Satelliten zu dekodieren
# (Cold Start = Minuten, drinnen quasi unmoeglich), holt das Board sie per
# HTTPS-REST von nRF Cloud in Sekunden. Laeuft eigenstaendig, voellig unabhaengig
# von der HiveMQ-MQTT-Verbindung, und ist BEST-EFFORT: ist das Board noch nicht
# bei nRF Cloud onboarded, scheitert nur nrf_cloud_jwt_generate() (-77) und GNSS
# laeuft weiter (Priority-Mode + Netzwerkzeit). nRF Cloud nutzt einen EIGENEN
# Sec-Tag (16842753, NICHT den HiveMQ-Tag 16842) -> die HiveMQ-CA bleibt intakt.
CONFIG_NRF_CLOUD=y
CONFIG_NRF_CLOUD_REST=y
CONFIG_NRF_CLOUD_AGNSS=y
CONFIG_MODEM_JWT=y
# nRF-Cloud-Client-ID = Modem-UUID (nicht IMEI); so registriert der spaetere
# Provisioning-/Claim-Weg dasselbe Geraet, das der A-GNSS-Call anspricht.
CONFIG_NRF_CLOUD_CLIENT_ID_SRC_INTERNAL_UUID=y
# Attestation-Token beim Boot ausgeben (read-only, kein Key-Write): damit laesst
# sich das Board auf nrfcloud.com claimen -> danach liefert A-GNSS echte Daten.
CONFIG_MODEM_ATTEST_TOKEN=y
# nRF Cloud (cJSON) + REST-Puffer brauchen mehr Heap als der bisherige Default.
CONFIG_HEAP_MEM_POOL_SIZE=8192

# --- nRF Cloud Device Provisioning (On-Device "Check-in") ---
# Der On-Device-Client meldet sich beim nRF-Cloud-Provisioning-Service. Sobald
# das Board dort geclaimed ist (Attestation-Token aus dem Boot-Log), erzeugt +
# installiert der Service die nRF-Cloud-Credentials am Sec-Tag 16842753 -> die
# JWT-Erzeugung klappt und A-GNSS liefert echte Ephemeriden (kein -8/-77 mehr).
# Vor dem Schreiben der Credentials nimmt der Client LTE per Callback offline
# (sichere Reihenfolge -> kein Modem-Brick), danach Reboot. Wir starten den
# Client NICHT automatisch beim Init, sondern erst per Trigger, nachdem die
# MQTT-Session steht und die HiveMQ-CA offline geschrieben ist (kein Kollidieren
# der Key-Writes) — siehe provision.c / bringup_onboard_begin().
CONFIG_NRF_PROVISIONING=y
CONFIG_NRF_PROVISIONING_HTTP=y
CONFIG_NRF_PROVISIONING_AUTO_START_ON_INIT=n
CONFIG_NRF_PROVISIONING_WITH_CERT=y
CONFIG_NRF_PROVISIONING_ROOT_CA_SEC_TAG=50
CONFIG_NRF_PROVISIONING_PROVIDE_ATTESTATION_TOKEN=y
CONFIG_NRF_PROVISIONING_CODEC=y
CONFIG_NRF_PROVISIONING_CBOR=y
CONFIG_ZCBOR=y
CONFIG_ZCBOR_CANONICAL=y
CONFIG_NRF_PROVISIONING_CBOR_RECORDS=10
CONFIG_NRF_PROVISIONING_RX_BUF_SZ=2304
CONFIG_NRF_PROVISIONING_TX_BUF_SZ=2304
CONFIG_NRF_PROVISIONING_CODEC_AT_CMD_LEN=2048

# --- Settings/NVS (vom Provisioning-Client vorausgesetzt) ---
CONFIG_SETTINGS=y
CONFIG_NVS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y

# --- Float-Ausgabe (g-Werte, °C, lat/lon) ---
CONFIG_PICOLIBC=y
CONFIG_PICOLIBC_IO_FLOAT=y
CONFIG_CBPRINTF_FP_SUPPORT=y

# --- FOTA: self-hosted HTTP(S) update over MCUboot dual-slot -----------------
# MCUboot itself is built by sysbuild (SB_CONFIG_BOOTLOADER_MCUBOOT=y in
# sysbuild.conf); these app-side options pull in the download + apply pipeline:
#   fota_download  -> streams app_update.bin over LTE-M into the secondary slot
#   dfu_target(_mcuboot) + img_manager -> write the slot, tag it valid, and let
#   the app confirm the running image (boot_write_img_confirmed) so a healthy
#   swap becomes permanent and a bad one rolls back automatically.
# HTTPS reuses the ISRG Root X1 CA already on BROKER_SEC_TAG (16842) — the NAS
# host uses the same Let's Encrypt chain, so no extra credential write is needed.
# The download is triggered either by `bu fota <url>` (RTT shell) or by an MQTT
# command over the existing HiveMQ link (see mqtt.c handle_command()).
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_FOTA_DOWNLOAD=y
CONFIG_DFU_TARGET=y
CONFIG_DFU_TARGET_MCUBOOT=y
CONFIG_DOWNLOADER=y
CONFIG_IMG_MANAGER=y
CONFIG_IMG_ERASE_PROGRESSIVELY=y
CONFIG_MCUBOOT_IMG_MANAGER=y
CONFIG_STREAM_FLASH=y
# Emit a progress event per received fragment so the RTT log shows % during a
# download (helpful while validating on the bench; harmless in the field).
CONFIG_FOTA_DOWNLOAD_PROGRESS_EVT=y

# --- System ---
CONFIG_ASSERT=y
CONFIG_REBOOT=y
# main() builds float-heavy JSON (lat/lon/temps) and drives the modem session.
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_SHELL_STACK_SIZE=4096
