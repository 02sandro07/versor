# Keep the debug port (APPROTECT) openable for RTT on the CU board.
#
# On the nRF9151 (/ns build with TF-M) APPROTECT is closed by hardware at every
# reset; only the FIRST-stage secure image can reopen it. By default sysbuild
# leaves this unconfigured (APPROTECT_NO_SYSBUILD), so nothing reopens the port
# and RTT/SWD is dead after boot. Enabling *_USE_UICR makes SystemInit() in ALL
# images honour UICR.APPROTECT: when it is HwUnprotected (0x50FA50FA, which
# `nrfutil device recover` writes) debug access stays open, so we can read the
# RTT console on the CU board (its only I/O besides SWD). This does not weaken a
# production part — there the UICR is left protected and the port stays closed.
SB_CONFIG_APPROTECT_USE_UICR=y
SB_CONFIG_SECURE_APPROTECT_USE_UICR=y

# --- FOTA foundation: build the MCUboot bootloader (dual-slot) ---------------
# This is the single most important prerequisite for over-the-air updates: it
# makes sysbuild build MCUboot ahead of the app and lay the internal 1 MB flash
# out as two application slots (primary = running app, secondary = staged
# update), plus produce the signed `app_update.bin` FOTA package next to the
# app. A unit flashed WITHOUT this can never be updated OTA — it must be baked
# into the very first production flash. The nRF9151 app is small (~30 % of a
# single slot), so both slots fit in internal flash and no external flash chip
# is needed.
SB_CONFIG_BOOTLOADER_MCUBOOT=y

# NOTE (production): the build is signed with Nordic's DEFAULT, PUBLIC MCUboot
# key, which is fine for bring-up/lab but MUST be replaced before shipping —
# otherwise anyone can sign an image the bootloader will accept. For the serie,
# generate a private key and point MCUboot at it here, e.g.:
#   SB_CONFIG_BOOT_SIGNATURE_TYPE_ED25519=y
#   SB_CONFIG_BOOT_SIGNATURE_KEY_FILE="/abs/path/to/cdc-inco-mcuboot-priv.pem"
# Keep that key OUT of git (like app_credentials.h) and back it up safely: lose
# it and you can no longer sign updates these units will accept.
